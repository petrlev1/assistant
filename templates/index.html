<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG-система — Чат</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .header .user-info .username {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
        }
        .btn-logout {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-logout:hover {
            background: rgba(255,255,255,0.3);
        }
        /* Chat container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            align-self: flex-start;
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .message .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
            margin-bottom: 4px;
        }
        .message.bot .label { color: #764ba2; }
        .message.user .label { color: rgba(255,255,255,0.8); }
        .message .content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .message .content p { margin-bottom: 8px; }
        .message .content p:last-child { margin-bottom: 0; }
        /* Input area */
        .input-area {
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 16px 30px;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        .input-area textarea {
            flex: 1;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            min-height: 48px;
            max-height: 120px;
        }
        .input-area textarea:focus {
            border-color: #667eea;
        }
        .btn-send {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-send:hover { opacity: 0.9; }
        .btn-send:active { transform: scale(0.97); }
        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* Status indicator */
        .status-bar {
            padding: 8px 30px;
            font-size: 12px;
            color: #888;
            background: #fafafa;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }
        .status-bar .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-bar .dot.green { background: #4caf50; }
        .status-bar .dot.red { background: #f44336; }
        .status-bar .dot.yellow { background: #ff9800; }
        /* Typing indicator */
        .typing {
            align-self: flex-start;
            background: white;
            padding: 12px 18px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: none;
        }
        .typing .dots {
            display: flex;
            gap: 4px;
        }
        .typing .dot-anim {
            width: 8px;
            height: 8px;
            background: #764ba2;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing .dot-anim:nth-child(1) { animation-delay: -0.32s; }
        .typing .dot-anim:nth-child(2) { animation-delay: -0.16s; }
        .typing .dot-anim:nth-child(3) { animation-delay: 0s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        /* Scrollbar */
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 RAG-система</h1>
        <div class="user-info">
            <span class="username">👤 {{ session.username }}</span>
            <a href="{{ url_for('logout') }}" class="btn-logout">Выйти</a>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message bot">
            <div class="label">Система</div>
            <div class="content">Привет, {{ session.username }}! Задай мне вопрос по базе знаний.</div>
        </div>
        <div class="typing" id="typingIndicator">
            <div class="dots">
                <div class="dot-anim"></div>
                <div class="dot-anim"></div>
                <div class="dot-anim"></div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <textarea id="questionInput" placeholder="Введите ваш вопрос..." rows="1" onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();sendQuestion()}"></textarea>
        <button class="btn-send" id="sendBtn" onclick="sendQuestion()">Отправить</button>
    </div>

    <div class="status-bar" id="statusBar">
        <span class="dot yellow" id="statusDot"></span>
        <span id="statusText">Проверка соединения...</span>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const questionInput = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // Проверка статуса при загрузке
        checkStatus();
        // Загрузка истории чата
        loadHistory();

        function checkStatus() {
            fetch('/status')
                .then(r => r.json())
                .then(data => {
                    if (data.initialized) {
                        statusDot.className = 'dot green';
                        statusText.textContent = 'Система готова';
                    } else {
                        statusDot.className = 'dot yellow';
                        statusText.textContent = 'Инициализация...';
                        setTimeout(checkStatus, 2000);
                    }
                })
                .catch(() => {
                    statusDot.className = 'dot red';
                    statusText.textContent = 'Ошибка соединения';
                });
        }

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'bot'}`;
            div.innerHTML = `
                <div class="label">${isUser ? 'Вы' : 'Бот'}</div>
                <div class="content">${escapeHtml(text).replace(/\\n/g, '<br>')}</div>
            `;
            chatContainer.insertBefore(div, typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function loadHistory() {
            fetch('/history')
                .then(r => r.json())
                .then(data => {
                    if (data.messages && data.messages.length > 0) {
                        // Удаляем приветственное сообщение, если есть история
                        const welcomeMsg = chatContainer.querySelector('.message.bot:first-child');
                        if (welcomeMsg && welcomeMsg.querySelector('.label').textContent === 'СИСТЕМА') {
                            welcomeMsg.remove();
                        }
                        data.messages.forEach(msg => {
                            const label = msg.role === 'user' ? 'Вы' : 'Бот';
                            const div = document.createElement('div');
                            div.className = `message ${msg.role === 'user' ? 'user' : 'bot'}`;
                            div.innerHTML = `
                                <div class="label">${label}</div>
                                <div class="content">${escapeHtml(msg.message).replace(/\\n/g, '<br>')}</div>
                            `;
                            chatContainer.insertBefore(div, typingIndicator);
                        });
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                })
                .catch(() => {}); // Игнорируем ошибки загрузки истории
        }

        function setLoading(loading) {
            sendBtn.disabled = loading;
            sendBtn.textContent = loading ? '...' : 'Отправить';
            questionInput.disabled = loading;
            typingIndicator.style.display = loading ? 'block' : 'none';
            if (loading) {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            addMessage(question, true);
            questionInput.value = '';
            questionInput.style.height = 'auto';
            setLoading(true);

            fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            })
            .then(response => response.json())
            .then(data => {
                setLoading(false);
                if (data.answer) {
                    addMessage(data.answer, false);
                } else if (data.error) {
                    addMessage('❌ Ошибка: ' + data.error, false);
                }
            })
            .catch(error => {
                setLoading(false);
                addMessage('❌ Ошибка соединения с сервером', false);
            });
        }

        // Auto-resize textarea
        questionInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
    </script>
</body>
</html>
