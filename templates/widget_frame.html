<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ w.name if w else 'Ассистент' }}</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f6fa; display: flex; flex-direction: column; overflow: hidden;
    }
    .hd {
        background: linear-gradient(135deg, {{ w.theme_color if w else '#667eea' }}, #764ba2);
        color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .hd .ava { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.22);
        display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .hd .ttl { flex: 1; min-width: 0; }
    .hd .ttl b { display: block; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hd .ttl span { font-size: 11.5px; opacity: .85; }
    .hd button { background: none; border: none; color: #fff; cursor: pointer; font-size: 16px;
        padding: 6px 8px; border-radius: 8px; opacity: .85; }
    .hd button:hover { background: rgba(255,255,255,.15); opacity: 1; }

    #chat { flex: 1; overflow-y: auto; padding: 14px 12px 6px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 9px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.45;
        white-space: pre-wrap; word-wrap: break-word; }
    .msg.bot { align-self: flex-start; background: #fff; color: #1f2937; border-bottom-left-radius: 4px;
        box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .msg.user { align-self: flex-end; background: linear-gradient(135deg, {{ w.theme_color if w else '#667eea' }}, #764ba2);
        color: #fff; border-bottom-right-radius: 4px; }
    .msg.sys { align-self: center; background: none; color: #9ca3af; font-size: 11.5px; }
    .dots { display: flex; gap: 4px; padding: 12px; align-self: flex-start; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: #b6bccb; animation: bl 1s infinite; }
    .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes bl { 0%,100% { opacity: .3 } 50% { opacity: 1 } }

    .in { flex-shrink: 0; padding: 10px 10px 12px; background: #fff; border-top: 1px solid #eceef3; }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    textarea { flex: 1; resize: none; border: 1px solid #d8dbe6; border-radius: 12px; padding: 10px 12px;
        font: inherit; font-size: 13.5px; max-height: 110px; outline: none; background: #f8f9fc; }
    textarea:focus { border-color: {{ w.theme_color if w else '#667eea' }}; background: #fff; }
    .send { border: none; cursor: pointer; width: 40px; height: 40px; border-radius: 12px; color: #fff;
        background: linear-gradient(135deg, {{ w.theme_color if w else '#667eea' }}, #764ba2); font-size: 16px; flex-shrink: 0; }
    .send:disabled { opacity: .5; cursor: default; }
    .foot { text-align: center; font-size: 10.5px; color: #b3b8c6; padding-top: 7px; }
    .foot a { color: #8b93a7; text-decoration: none; } .foot a:hover { text-decoration: underline; }
    .err-box { margin: auto; text-align: center; color: #6b7280; font-size: 14px; padding: 30px; }
</style>
</head>
<body>
{% if error %}
    <div class="err-box">⚠️ {{ error }}</div>
{% else %}
    <div class="hd">
        <div class="ava">🤖</div>
        <div class="ttl"><b>{{ w.name }}</b><span>Онлайн — спросите</span></div>
        <button id="newBtn" title="Новый диалог">🆕</button>
        <button id="clearBtn" title="Очистить переписку">🗑️</button>
        <button id="closeBtn" title="Закрыть чат">✕</button>
    </div>

    <div id="chat">
        <div class="msg bot">{{ greeting }}</div>
        <div class="dots" id="dots" style="display:none"><i></i><i></i><i></i></div>
    </div>

    <div class="in">
        <div class="row">
            <textarea id="q" rows="1" placeholder="Ваш вопрос..."></textarea>
            <button class="send" id="send" title="Отправить">➤</button>
        </div>
        <div class="foot">Powered by <a href="https://ragstone.ru" target="_blank" rel="noopener">RAGSTONE</a></div>
    </div>

<script>
(function () {
    var KEY = {{ key|tojson }};
    var SITE = {{ site|tojson }};
    var LS = 'ragstone_widget_v1';

    function visitorId() {
        var v = '';
        try { v = localStorage.getItem(LS) || ''; } catch (e) {}
        if (!/^[0-9a-zA-Z_-]{8,64}$/.test(v)) {
            v = ''; for (var i = 0; i < 32; i++) v += 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[Math.floor(Math.random()*62)];
            try { localStorage.setItem(LS, v); } catch (e) {}
        }
        return v;
    }
    var VISITOR = visitorId();

    var chat = document.getElementById('chat'), q = document.getElementById('q'),
        send = document.getElementById('send'), dots = document.getElementById('dots');

    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function add(text, who, cls) {
        var div = document.createElement('div');
        div.className = 'msg ' + (cls || who);
        div.innerHTML = esc(text);
        chat.insertBefore(div, dots);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }
    function loading(on) {
        send.disabled = on; q.disabled = on; dots.style.display = on ? 'flex' : 'none';
        if (on) chat.scrollTop = chat.scrollHeight;
    }
    function api(path, body) {
        var opts = body
            ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
            : {};
        return fetch(path, opts).then(function (r) { return r.json(); });
    }
    function pack(extra) {
        var p = { key: KEY, visitor_id: VISITOR, site: SITE };
        for (var k in extra) p[k] = extra[k];
        return p;
    }

    // История этого посетителя (переживает перезагрузку страницы сайта)
    api('/api/widget/history?' + new URLSearchParams(pack())).then(function (d) {
        if (d.messages && d.messages.length) {
            chat.querySelector('.msg.bot').remove();
            // Разделитель: сообщения выше бот уже не учитывает (кнопка «Новый диалог»)
            var startTs = Number(d.session_started_at) || 0, done = false;
            d.messages.forEach(function (m, idx) {
                if (!done && startTs && Number(m.ts) >= startTs && idx > 0) {
                    done = true;
                    add('— новый диалог —', null, 'sys');
                }
                add(m.message, m.role === 'user' ? 'user' : 'bot');
            });
        }
    }).catch(function () {});

    function ask() {
        var text = q.value.trim();
        if (!text || send.disabled) return;
        add(text, 'user');
        q.value = ''; q.style.height = 'auto';
        loading(true);
        api('/api/widget/ask', pack({ question: text })).then(function (d) {
            loading(false);
            add(d.answer || d.error || 'Произошла ошибка. Попробуйте ещё раз.', 'bot', d.answer ? 'bot' : 'sys');
            q.focus();
        }).catch(function () {
            loading(false);
            add('Нет связи с ассистентом. Попробуйте ещё раз.', 'bot', 'sys');
        });
    }

    send.addEventListener('click', ask);
    q.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
    });
    q.addEventListener('input', function () {
        q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 110) + 'px';
    });
    document.getElementById('newBtn').addEventListener('click', function () {
        if (!confirm('Начать новый диалог? Прошлые сообщения останутся в ленте, но ассистент их учитывать не будет.')) return;
        api('/api/widget/new', pack()).then(function () { location.reload(); });
    });
    document.getElementById('clearBtn').addEventListener('click', function () {
        if (!confirm('Очистить переписку с ассистентом?')) return;
        api('/api/widget/clear', pack()).then(function () { location.reload(); });
    });
    document.getElementById('closeBtn').addEventListener('click', function () {
        try { parent.postMessage({ ragstone: 'close' }, '*'); } catch (e) {}
    });
    q.focus();
})();
</script>
{% endif %}
</body>
</html>
